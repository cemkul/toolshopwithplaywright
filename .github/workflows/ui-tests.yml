name: UI Tests

on:
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Playwright Browsers
        run: mvn -Dexec.mainClass="com.microsoft.playwright.CLI" "-Dexec.args=install --with-deps" exec:java
      - name: Run UI tests headless
        continue-on-error: true
        run: mvn clean test -Dtest=HomeTests,ProductTests,CartTests,AuthTests,CheckoutTests -Dheadless=true

      - name: Install Allure CLI (Windows)
        if: always() && runner.os == 'Windows'
        run: |
          $progressPreference = 'silentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip" -OutFile "allure.zip"
          Expand-Archive -Path allure.zip -DestinationPath "C:\"
          echo "C:\allure-2.29.0\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Allure CLI (Linux)
        if: always() && runner.os == 'Linux'
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxvf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Generate Allure HTML Report
        if: always()
        run: allure generate target/allure-results --clean -o target/allure-report

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-html-report
          path: target/allure-report

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: target/allure-results